[package]
name = "lan-mouse-gtk"
description = "GTK4 / Libadwaita Frontend for lan-mouse"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/feschber/lan-mouse"

[dependencies]
gtk = { package = "gtk4", version = "0.9.0", features = ["v4_2"] }
adw = { package = "libadwaita", version = "0.7.0", features = ["v1_1"] }
async-channel = { version = "2.1.1" }
hostname = "0.4.0"
log = "0.4.20"
lan-mouse-ipc = { path = "../lan-mouse-ipc", version = "0.3.0" }
input-event = { path = "../input-event", version = "0.4.0", default-features = false }
thiserror = "2.0.0"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.107"
sha2 = "0.10.8"
# rustls + ring + bundled webpki roots (no aws-lc-rs / native-tls)
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.24", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "NSAccessibility",
    "NSAnimation",
    "NSAnimationContext",
    "NSBitmapImageRep",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSImageView",
    "NSPanel",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSGeometry"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CAMediaTimingFunction"] }

[build-dependencies]
glib-build-tools = { version = "0.20.0" }

name: "Release"
run-name: "Release - ${{ github.ref_name }}"

# Artifacts are built on every push to the listed branches and on tags.
# A GitHub Release is published only for tags vX.Y.Z (see the `release` job).
on:
  push:
    branches: [ "main", "clipboard-macos" ]
    tags:
      - v**
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-release-build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libx11-dev libxtst-dev
        sudo apt-get install libadwaita-1-dev libgtk-4-dev
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/lan-mouse lan-mouse-linux-x86_64
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: lan-mouse-linux-x86_64
        path: |
          lan-mouse-linux-x86_64
          target/release/bundle/deb/lan-mouse_*.deb
          target/release/bundle/appimage/lan-mouse_*.AppImage

  linux-arm64-release-build:
    runs-on: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libx11-dev libxtst-dev
        sudo apt-get install libadwaita-1-dev libgtk-4-dev
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/lan-mouse lan-mouse-linux-arm64
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: lan-mouse-linux-arm64
        path: |
          lan-mouse-linux-arm64
          target/release/bundle/deb/lan-mouse_*.deb
          target/release/bundle/appimage/lan-mouse_*.AppImage

  windows-release-build:
    runs-on: windows-latest
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    # needed for cache restore
    - name: create gtk dir
      run: mkdir C:\gtk-build\gtk\x64\release
    - uses: actions/cache@v3
      id: cache
      with:
        path: c:/gtk-build/gtk/x64/release/**
        key: gtk-windows-build
        restore-keys: gtk-windows-build
    - name: Update path
      run: |
        echo "PKG_CONFIG=C:\gtk-build\gtk\x64\release\bin\pkgconf.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "C:\pkg-config-lite-0.28-1\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "C:\gtk-build\gtk\x64\release\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo $env:GITHUB_PATH
        echo $env:PATH
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        # choco install msys2
        # choco install visualstudio2022-workload-vctools
        # choco install pkgconfiglite
        py -m venv .venv
        .venv\Scripts\activate.ps1
        py -m pip install gvsbuild
        # see https://github.com/wingtk/gvsbuild/pull/1004
        Move-Item "C:\Program Files\Git\usr\bin" "C:\Program Files\Git\usr\notbin"
        Move-Item "C:\Program Files\Git\bin" "C:\Program Files\Git\notbin"
        gvsbuild build --vs-ver=vs2026 --msys-dir=C:\msys64 gtk4 libadwaita librsvg
        Move-Item "C:\Program Files\Git\usr\notbin" "C:\Program Files\Git\usr\bin"
        Move-Item "C:\Program Files\Git\notbin" "C:\Program Files\Git\bin"
    - uses: actions/checkout@v6
    - name: Release Build
      run: cargo build --release
    - name: Create Archive
      run: |
        mkdir "lan-mouse-windows"
        Get-Childitem -Path "C:\\gtk-build\\gtk\\x64\\release\\bin\\*.dll" -File -Recurse | Copy-Item -Destination "lan-mouse-windows"
        Copy-Item -Path "target\release\lan-mouse.exe" -Destination "lan-mouse-windows"
        Copy-Item -Path "build-aux\windows\install.cmd", "build-aux\windows\install.ps1", "build-aux\windows\uninstall.ps1" -Destination "lan-mouse-windows"
        Compress-Archive -Path "lan-mouse-windows\*" -DestinationPath lan-mouse-windows-x86_64.zip
    - name: Get version
      id: version
      run: |
        $m = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
        $version = $m.Matches[0].Groups[1].Value
        if (-not $version) { throw "version not found in Cargo.toml" }
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
    - name: Build installer (Inno Setup)
      run: |
        $candidates = @(
          "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
          "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
          "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
        )
        $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
        if (-not $iscc) { $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }
        if (-not $iscc) {
          choco install innosetup -y --no-progress
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        }
        if (-not $iscc) { throw "ISCC.exe not found" }
        & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "build-aux\windows\lan-mouse.iss"
        if ($LASTEXITCODE -ne 0) { throw "iscc failed with exit code $LASTEXITCODE" }
        Get-ChildItem "LanMouse-Setup-*.exe"
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: lan-mouse-windows-x86_64
        path: |
          lan-mouse-windows-x86_64.zip
          LanMouse-Setup-*.exe

  macos-release-build:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        brew install --cask inkscape
        brew install gtk4 libadwaita imagemagick librsvg
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/lan-mouse lan-mouse-macos-intel
    - name: Make icns
      run: scripts/makeicns.sh
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release
        scripts/copy-macos-dylib.sh "target/release/bundle/osx/Lan Mouse.app/Contents/MacOS/lan-mouse"
    - name: Zip bundle
      run: |
        cd target/release/bundle/osx
        # ditto keeps symlinks and attributes of the bundle; "Lan Mouse.app" ends up at the top level
        ditto -c -k --keepParent "Lan Mouse.app" "lan-mouse-macos-intel.zip"
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: lan-mouse-macos-intel
        path: target/release/bundle/osx/lan-mouse-macos-intel.zip

  macos-arm64-release-build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        brew install --cask inkscape
        brew install gtk4 libadwaita imagemagick librsvg
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/lan-mouse lan-mouse-macos-arm64
    - name: Make icns
      run: scripts/makeicns.sh
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release
        scripts/copy-macos-dylib.sh "target/release/bundle/osx/Lan Mouse.app/Contents/MacOS/lan-mouse"
    - name: Zip bundle
      run: |
        cd target/release/bundle/osx
        # ditto keeps symlinks and attributes of the bundle; "Lan Mouse.app" ends up at the top level
        ditto -c -k --keepParent "Lan Mouse.app" "lan-mouse-macos-arm64.zip"
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: lan-mouse-macos-arm64
        path: target/release/bundle/osx/lan-mouse-macos-arm64.zip

  release:
    name: "Release"
    # only tags vX.Y.Z publish a release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-release-build, linux-release-build, linux-arm64-release-build, macos-release-build, macos-arm64-release-build]
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Download build artifacts
      uses: actions/download-artifact@v4
    - name: Check version against the tag
      id: version
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
        if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match version $CARGO_VERSION in Cargo.toml"
          exit 1
        fi
        echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
    - name: Generate latest.json
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        WIN="lan-mouse-windows-x86_64/LanMouse-Setup-${VERSION}.exe"
        ARM="lan-mouse-macos-arm64/lan-mouse-macos-arm64.zip"
        INTEL="lan-mouse-macos-intel/lan-mouse-macos-intel.zip"
        for f in "$WIN" "$ARM" "$INTEL"; do
          test -f "$f" || { echo "::error::missing release asset $f"; exit 1; }
        done
        BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
        jq -n \
          --arg version "$VERSION" \
          --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" \
          --arg win_url "$BASE/$(basename "$WIN")" --arg win_sha "$(sha256sum "$WIN" | cut -d' ' -f1)" \
          --arg arm_url "$BASE/$(basename "$ARM")" --arg arm_sha "$(sha256sum "$ARM" | cut -d' ' -f1)" \
          --arg intel_url "$BASE/$(basename "$INTEL")" --arg intel_sha "$(sha256sum "$INTEL" | cut -d' ' -f1)" \
          '{
            version: $version,
            notes_url: $notes,
            assets: {
              "windows-x86_64": {url: $win_url, sha256: $win_sha},
              "macos-aarch64": {url: $arm_url, sha256: $arm_sha},
              "macos-x86_64": {url: $intel_url, sha256: $intel_sha}
            }
          }' > latest.json
        cat latest.json
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        prerelease: false
        generate_release_notes: true
        files: |
          latest.json
          lan-mouse-windows-x86_64/LanMouse-Setup-*.exe
          lan-mouse-windows-x86_64/lan-mouse-windows-x86_64.zip
          lan-mouse-macos-arm64/lan-mouse-macos-arm64.zip
          lan-mouse-macos-intel/lan-mouse-macos-intel.zip
          lan-mouse-linux-x86_64/lan-mouse-linux-x86_64
          lan-mouse-linux-x86_64/target/release/bundle/deb/lan-mouse_*.deb
          lan-mouse-linux-x86_64/target/release/bundle/appimage/lan-mouse_*.AppImage
          lan-mouse-linux-arm64/lan-mouse-linux-arm64
          lan-mouse-linux-arm64/target/release/bundle/deb/lan-mouse_*.deb
          lan-mouse-linux-arm64/target/release/bundle/appimage/lan-mouse_*.AppImage
